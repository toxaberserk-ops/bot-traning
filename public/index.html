<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
        
        .login-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: #1a1f3a;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2d3a5c;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo { font-size: 64px; text-align: center; margin-bottom: 12px; }
        .login-box h1 { font-size: 28px; text-align: center; margin-bottom: 8px; color: #fff; }
        .login-box > p { font-size: 14px; text-align: center; color: #a0a0a0; margin-bottom: 30px; }

        .role-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .role-btn {
            padding: 16px;
            border: 2px solid #2d3a5c;
            background: #0f1628;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #a0a0a0;
            transition: all 0.3s;
        }

        .role-btn:hover { border-color: #4a5fa7; background: #141d35; }
        .role-btn.active {
            background: linear-gradient(135deg, #4a5fa7 0%, #2c3e5f 100%);
            color: white;
            border-color: #4a5fa7;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #b0b0b0;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #2d3a5c;
            background: #0f1628;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: #e0e0e0;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4a5fa7;
            background: #151f38;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4a5fa7 0%, #2c3e5f 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(74, 95, 167, 0.3); }
        .btn-small { padding: 6px 12px; width: auto; background: #2d3a5c; }

        .hidden { display: none !important; }

        .dashboard {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0e27;
        }

        .navbar {
            background: #1a1f3a;
            padding: 16px 20px;
            border-bottom: 1px solid #2d3a5c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .navbar h2 { font-size: 20px; color: #fff; }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #2d3a5c;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #707080;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #4a5fa7;
            border-bottom-color: #4a5fa7;
        }

        .section { margin-bottom: 24px; }
        .section h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #fff; }

        .stat-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #242a42 100%);
            border: 1px solid #2d3a5c;
            color: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }

        .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
        .stat-value { font-size: 36px; font-weight: 700; color: #4a5fa7; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

        .card {
            background: #1a1f3a;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #2d3a5c;
            margin-bottom: 12px;
        }

        .form-section {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #2d3a5c;
        }

        .form-section h4 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #fff; }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .message.show { display: block; }
        .message.success { background: #1d3a1d; color: #4ade80; border: 1px solid #2d5a2d; }
        .message.error { background: #3a1d1d; color: #f87171; border: 1px solid #5a2d2d; }

        .day-card {
            background: #1a1f3a;
            border: 1px solid #2d3a5c;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .day-title {
            font-weight: 600;
            color: #4a5fa7;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .exercise-item {
            background: #0f1628;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #4a5fa7;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .exercise-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4a5fa7;
        }

        .exercise-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .comment-box {
            background: #0f1628;
            border: 1px solid #2d3a5c;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
        }

        .comment-item {
            background: #1a1f3a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 12px;
            border-left: 2px solid #4a5fa7;
        }

        .comment-date { font-size: 10px; color: #707080; margin-top: 4px; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2d3a5c;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a5fa7 0%, #2c3e5f 100%);
            transition: width 0.3s;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1f3a;
            border: 1px solid #2d3a5c;
            border-radius: 8px;
            overflow: hidden;
        }

        table th {
            text-align: left;
            padding: 12px;
            background: #0f1628;
            border-bottom: 1px solid #2d3a5c;
            font-size: 12px;
            font-weight: 600;
            color: #a0a0a0;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #2d3a5c;
            font-size: 13px;
        }

        .empty-state { text-align: center; padding: 40px 20px; color: #707080; }

        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="logo">💪</div>
            <h1>FitTrack Pro</h1>
            <p>Профессиональное управление фитнесом</p>
            
            <div class="role-buttons">
                <button class="role-btn active" onclick="setRole('trainer')">👨‍🏫 Тренер</button>
                <button class="role-btn" onclick="setRole('client')">💪 Клиент</button>
            </div>
            
            <div id="trainerLoginForm">
                <div class="form-group">
                    <label>Пин-код</label>
                    <input type="password" id="pinInput" placeholder="••••" maxlength="4">
                </div>
                <button class="btn" onclick="loginTrainer()">Вход в админ-панель</button>
            </div>
            
            <div id="clientLoginForm" class="hidden">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="clientUsername" placeholder="ivan">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="clientPassword" placeholder="••••" autocomplete="off">
                </div>
                <button class="btn" onclick="loginClient()">Вход</button>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <!-- TRAINER DASHBOARD -->
    <div id="trainerDashboard" class="dashboard hidden">
        <div class="navbar">
            <h2>👨‍🏫 Админ-панель FitTrack</h2>
            <button class="logout-btn btn-small" onclick="logout()">Выход</button>
        </div>
        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" onclick="setTab('trainer', 'clients')">Клиенты</button>
                <button class="tab-btn" onclick="setTab('trainer', 'plans')">Планы</button>
                <button class="tab-btn" onclick="setTab('trainer', 'statistics')">Статистика</button>
            </div>
            
            <div id="trainer-clients">
                <div class="grid-3">
                    <div class="stat-card">
                        <div class="stat-label">Всего клиентов</div>
                        <div class="stat-value" id="totalClients">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Средний прогресс</div>
                        <div class="stat-value" id="avgProgress">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Активных</div>
                        <div class="stat-value" id="activeToday">0</div>
                    </div>
                </div>
                
                <div class="section">
                    <h3>Добавить нового клиента</h3>
                    <div class="form-section">
                        <div class="form-group">
                            <label>Имя клиента</label>
                            <input type="text" id="newClientName" placeholder="Иван Петров">
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>Логин</label>
                                <input type="text" id="newClientUsername" placeholder="ivan">
                            </div>
                            <div class="form-group">
                                <label>Пароль</label>
                                <input type="password" id="newClientPassword" placeholder="••••" autocomplete="off">
                            </div>
                        </div>
                        <button class="btn" onclick="createNewClient()">Добавить клиента ➕</button>
                    </div>
                </div>
                
                <div class="section">
                    <h3>Клиенты</h3>
                    <div id="clientsList"></div>
                </div>
            </div>
            
            <div id="trainer-plans" class="hidden">
                <div class="section">
                    <h3>Создать/Редактировать План</h3>
                    <div class="form-section">
                        <div class="form-group">
                            <label>Выберите клиента</label>
                            <select id="planClientSelect" onchange="loadClientPlan()"></select>
                        </div>
                        
                        <div id="planDays" style="display: none;">
                            <h4 style="margin-top: 20px; margin-bottom: 12px; color: #fff;">План на неделю</h4>
                            <div id="planEditorDays"></div>
                            <button class="btn" style="margin-top: 16px;" onclick="savePlan()">Сохранить план 💾</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="trainer-statistics" class="hidden">
                <div class="section">
                    <h3>Статистика клиентов</h3>
                    <div id="statisticsContent"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- CLIENT DASHBOARD -->
    <div id="clientDashboard" class="dashboard hidden">
        <div class="navbar">
            <h2 id="clientTitle">💪 Клиент</h2>
            <button class="logout-btn btn-small" onclick="logout()">Выход</button>
        </div>
        <div class="content">
            <div id="message" class="message"></div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="setTab('client', 'plan')">📅 Мой план</button>
                <button class="tab-btn" onclick="setTab('client', 'stats')">📊 Статистика</button>
            </div>
            
            <div id="client-plan">
                <div id="clientPlanContent"></div>
            </div>
            
            <div id="client-stats" class="hidden">
                <div class="section">
                    <h3>Ваша статистика прохождения</h3>
                    <div id="clientStatsContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentRole = 'trainer';
let currentTab = {};
let currentUser = null;
let currentClientForPlan = null;

function showMessage(text, type = 'success') {
    const msg = document.getElementById('message');
    msg.className = 'message show ' + type;
    msg.textContent = text;
    setTimeout(() => msg.classList.remove('show'), 3000);
}

function setRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && role === 'trainer') || (i === 1 && role === 'client'));
    });
    document.getElementById('trainerLoginForm').classList.toggle('hidden', role === 'client');
    document.getElementById('clientLoginForm').classList.toggle('hidden', role === 'trainer');
}

function setTab(view, tab) {
    currentTab[view] = tab;
    document.querySelectorAll(`[id^="${view}-"]`).forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`${view}-${tab}`).classList.remove('hidden');
    
    if (view === 'trainer' && tab === 'plans') loadClientsForPlan();
    if (view === 'trainer' && tab === 'statistics') loadStatistics();
    if (view === 'client' && tab === 'stats') loadClientStats();
}

async function loginTrainer() {
    const pin = document.getElementById('pinInput').value;
    try {
        const res = await fetch('/api/login/trainer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (data.success) {
            currentUser = 'trainer';
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('trainerDashboard').classList.remove('hidden');
            loadTrainerDashboard();
        } else {
            showMessage('Неверный пин-код', 'error');
        }
    } catch (e) {
        showMessage('Ошибка подключения', 'error');
    }
}

async function loginClient() {
    const username = document.getElementById('clientUsername').value;
    const password = document.getElementById('clientPassword').value;
    
    if (!username || !password) {
        showMessage('Введите логин и пароль', 'error');
        return;
    }
    
    try {
        const res = await fetch('/api/login/client', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            currentUser = data.clientId;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('clientDashboard').classList.remove('hidden');
            document.getElementById('clientTitle').textContent = '💪 ' + data.name;
            loadClientPlanView();
        } else {
            showMessage('Неверные логин или пароль', 'error');
        }
    } catch (e) {
        showMessage('Ошибка подключения', 'error');
    }
}

async function loadTrainerDashboard() {
    try {
        const res = await fetch('/api/clients');
        const clients = await res.json();
        
        document.getElementById('totalClients').textContent = clients.length;
        const avgProg = Math.round(clients.reduce((sum, c) => sum + c.progress, 0) / (clients.length || 1));
        document.getElementById('avgProgress').textContent = avgProg + '%';
        document.getElementById('activeToday').textContent = clients.length;
        
        let html = '';
        clients.forEach(c => {
            html += `<div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-weight: 600; color: #fff;">${c.name}</div>
                        <div style="font-size: 12px; color: #a0a0a0;">Логин: ${c.username} | ${c.goal}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-weight: 600; color: #4a5fa7; font-size: 16px;">${c.progress}%</div>
                        <button class="btn-small" onclick="deleteClient(${c.id})">✕ Удалить</button>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('clientsList').innerHTML = html || '<div class="empty-state">Нет клиентов</div>';
    } catch (e) {
        console.log('Error:', e);
    }
}

async function createNewClient() {
    const name = document.getElementById('newClientName').value;
    const username = document.getElementById('newClientUsername').value;
    const password = document.getElementById('newClientPassword').value;
    
    if (!name || !username || !password) {
        showMessage('Заполните все поля', 'error');
        return;
    }
    
    try {
        const res = await fetch('/api/create-client', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password, goal: 'Набор мышечной массы', goalDetails: '' })
        });
        const data = await res.json();
        if (data.success) {
            showMessage('Клиент добавлен! 🎉');
            document.getElementById('newClientName').value = '';
            document.getElementById('newClientUsername').value = '';
            document.getElementById('newClientPassword').value = '';
            loadTrainerDashboard();
        } else {
            showMessage(data.message || 'Ошибка', 'error');
        }
    } catch (e) {
        showMessage('Ошибка подключения', 'error');
    }
}

async function deleteClient(clientId) {
    if (!confirm('Удалить клиента?')) return;
    try {
        const res = await fetch(`/api/client/${clientId}`, { method: 'DELETE' });
        if (res.ok) {
            showMessage('Клиент удален');
            loadTrainerDashboard();
        }
    } catch (e) { showMessage('Ошибка', 'error'); }
}

async function loadClientsForPlan() {
    try {
        const res = await fetch('/api/clients');
        const clients = await res.json();
        
        let html = '<option value="">-- Выберите клиента --</option>';
        clients.forEach(c => {
            html += `<option value="${c.id}">${c.name}</option>`;
        });
        document.getElementById('planClientSelect').innerHTML = html;
    } catch (e) { console.log('Error:', e); }
}

async function loadClientPlan() {
    const clientId = document.getElementById('planClientSelect').value;
    if (!clientId) return;
    
    currentClientForPlan = clientId;
    
    try {
        const res = await fetch(`/api/plan/${clientId}`);
        const plan = await res.json();
        
        const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        let html = '';
        
        days.forEach(day => {
            const exercises = plan && plan.plan && plan.plan[day] ? plan.plan[day] : '';
            html += `<div class="form-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="font-size: 16px; margin: 0; color: #4a5fa7; font-weight: 700;">${day}</label>
                </div>
                <textarea id="day-${day}" placeholder="Упражнения для ${day}..." style="margin-top: 8px; min-height: 100px;">${exercises}</textarea>
            </div>`;
        });
        
        document.getElementById('planEditorDays').innerHTML = html;
        document.getElementById('planDays').style.display = 'block';
    } catch (e) { console.log('Error:', e); }
}

async function savePlan() {
    if (!currentClientForPlan) {
        showMessage('Выберите клиента', 'error');
        return;
    }
    
    const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const plan = {};
    
    days.forEach(day => {
        const text = document.getElementById(`day-${day}`).value;
        plan[day] = text.split('\n').filter(e => e.trim());
    });
    
    try {
        const res = await fetch(`/api/plan/${currentClientForPlan}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plan })
        });
        const data = await res.json();
        if (data.success) {
            showMessage('План сохранён! 💾');
        }
    } catch (e) { showMessage('Ошибка', 'error'); }
}

async function loadStatistics() {
    try {
        const res = await fetch('/api/clients');
        const clients = await res.json();
        
        let html = '';
        for (const client of clients) {
            const statsRes = await fetch(`/api/plan-stats/${client.id}`);
            const statsData = await statsRes.json();
            const stats = statsData.stats;
            
            let statsHtml = '<div style="margin-top: 12px;">';
            Object.entries(stats).forEach(([day, data]) => {
                statsHtml += `<div style="margin-bottom: 8px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span>${day}</span>
                        <span style="color: #4a5fa7;">${data.completed}/${data.total} (${data.percent}%)</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${data.percent}%"></div>
                    </div>
                </div>`;
            });
            statsHtml += '</div>';
            
            html += `<div class="card">
                <div style="font-weight: 600; color: #fff; margin-bottom: 8px;">${client.name}</div>
                ${statsHtml}
            </div>`;
        }
        
        document.getElementById('statisticsContent').innerHTML = html || '<div class="empty-state">Нет данных</div>';
    } catch (e) { console.log('Error:', e); }
}

async function loadClientPlanView() {
    try {
        const res = await fetch(`/api/plan/${currentUser}`);
        const plan = await res.json();
        
        if (!plan || !plan.plan) {
            document.getElementById('clientPlanContent').innerHTML = '<div class="empty-state">План ещё не создан тренером</div>';
            return;
        }
        
        const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        let html = '';
        
        for (const day of days) {
            if (plan.plan[day] && plan.plan[day].length > 0) {
                html += `<div class="day-card">
                    <div class="day-title">📅 ${day}</div>`;
                
                plan.plan[day].forEach((exercise, idx) => {
                    const isCompleted = plan.progress && plan.progress[day] && plan.progress[day][idx];
                    html += `<div class="exercise-item ${isCompleted ? 'completed' : ''}">
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="markExercise(${idx}, '${day}', this.checked)">
                        <span>${exercise}</span>
                    </div>`;
                });
                
                html += `<div class="comment-box">
                    <textarea id="comment-${day}" placeholder="Добавить комментарий..." style="width: 100%; padding: 8px; border: 1px solid #2d3a5c; background: #0f1628; color: #e0e0e0; border-radius: 4px; font-family: inherit; min-height: 60px;"></textarea>
                    <button class="btn-small" style="margin-top: 8px; width: 100%;" onclick="addComment('${day}')">Добавить 💬</button>
                    <div id="comments-${day}" style="margin-top: 12px;"></div>
                </div>
                </div>`;
            }
        }
        
        document.getElementById('clientPlanContent').innerHTML = html || '<div class="empty-state">План не содержит упражнений</div>';
        
        // Загрузить комментарии
        for (const day of days) {
            loadComments(day);
        }
    } catch (e) { console.log('Error:', e); }
}

async function markExercise(idx, day, completed) {
    try {
        await fetch('/api/workout-progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId: currentUser, day, exerciseIndex: idx, completed })
        });
    } catch (e) { console.log('Error:', e); }
}

async function addComment(day) {
    const text = document.getElementById(`comment-${day}`).value;
    if (!text.trim()) return;
    
    try {
        const res = await fetch('/api/plan-comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId: currentUser, day, text })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById(`comment-${day}`).value = '';
            loadComments(day);
        }
    } catch (e) { console.log('Error:', e); }
}

async function loadComments(day) {
    try {
        const res = await fetch(`/api/plan-comments/${currentUser}/${day}`);
        const comments = await res.json();
        
        let html = '';
        comments.forEach(c => {
            const date = new Date(c.date).toLocaleString('ru-RU');
            html += `<div class="comment-item">${c.text}<div class="comment-date">${date}</div></div>`;
        });
        
        document.getElementById(`comments-${day}`).innerHTML = html;
    } catch (e) { console.log('Error:', e); }
}

async function loadClientStats() {
    try {
        const res = await fetch(`/api/plan-stats/${currentUser}`);
        const data = await res.json();
        const stats = data.stats;
        
        let html = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">';
        
        Object.entries(stats).forEach(([day, data]) => {
            html += `<div class="stat-card">
                <div class="stat-label">${day}</div>
                <div class="stat-value" style="font-size: 24px;">${data.percent}%</div>
                <div style="font-size: 11px; color: #a0a0a0; margin-top: 4px;">${data.completed}/${data.total} упр.</div>
            </div>`;
        });
        
        html += '</div>';
        document.getElementById('clientStatsContent').innerHTML = html || '<div class="empty-state">Нет данных</div>';
    } catch (e) { console.log('Error:', e); }
}

function logout() {
    currentUser = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('trainerDashboard').classList.add('hidden');
    document.getElementById('clientDashboard').classList.add('hidden');
    document.getElementById('pinInput').value = '';
    document.getElementById('clientUsername').value = '';
    document.getElementById('clientPassword').value = '';
}
</script>

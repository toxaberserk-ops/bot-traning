<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FitTrack</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --tg-color-bg: #fff;
            --tg-color-text: #000;
            --tg-color-hint: #999;
            --tg-color-link: #0088cc;
            --tg-color-button-bg: #0088cc;
            --tg-color-button-text: #fff;
        }

        body {
            background: var(--tg-color-bg);
            color: var(--tg-color-text);
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-content {
            width: 100%;
            max-width: 320px;
        }

        .logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--tg-color-hint);
            text-align: center;
            margin-bottom: 32px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-btn {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: var(--tg-color-bg);
            color: var(--tg-color-text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-btn.active {
            border-color: var(--tg-color-button-bg);
            background: var(--tg-color-button-bg);
            color: var(--tg-color-button-text);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-color-text);
        }

        input, select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: var(--tg-color-bg);
            color: var(--tg-color-text);
            font-family: inherit;
        }

        input::placeholder {
            color: var(--tg-color-hint);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: var(--tg-color-button-bg);
            color: var(--tg-color-button-text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .dashboard {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            background: var(--tg-color-bg);
            gap: 12px;
        }

        .navbar-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: #f0f0f0;
            border: none;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            color: var(--tg-color-text);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--tg-color-button-bg);
            color: white;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .client-item {
            background: var(--tg-color-bg);
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .client-item:active {
            background: #f5f5f5;
        }

        .client-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .client-goal {
            font-size: 12px;
            color: var(--tg-color-hint);
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s;
        }

        .client-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }

        .stat-item {
            padding: 8px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .stat-item-label {
            color: var(--tg-color-hint);
            font-size: 11px;
        }

        .stat-item-value {
            font-weight: 600;
            color: var(--tg-color-text);
        }

        .form-section {
            margin-bottom: 20px;
        }

        .form-section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        table th {
            text-align: left;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            color: var(--tg-color-hint);
        }

        table td {
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--tg-color-link);
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-color-hint);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--tg-color-hint);
        }
    </style>
</head>
<body>
<div class="app-container" id="app"></div>

<script>
    // Инициализация Telegram WebApp
    let tg = null;
    if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        tg = Telegram.WebApp;
        tg.ready();
        tg.expand();
    }

    const API_URL = window.location.origin + '/api';

    // Состояние приложения
    let appState = {
        currentUser: null,
        userType: null,
        currentTab: 'login',
        selectedClientId: null,
        message: null,
        view: 'login'
    };

    function showMessage(text, type = 'success') {
        appState.message = { text, type };
        render();
        setTimeout(() => {
            appState.message = null;
            render();
        }, 3000);
    }

    async function loginTrainer(pin) {
        try {
            const response = await fetch(`${API_URL}/login/trainer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin })
            });
            const data = await response.json();
            
            if (data.success) {
                appState.currentUser = 'trainer';
                appState.userType = 'trainer';
                appState.view = 'trainer-dashboard';
                appState.currentTab = 'clients';
                showMessage(data.message);
            } else {
                showMessage(data.message, 'error');
            }
        } catch (error) {
            showMessage('Ошибка подключения', 'error');
        }
    }

    async function loginClient(clientId) {
        try {
            const response = await fetch(`${API_URL}/login/client`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId })
            });
            const data = await response.json();
            
            if (data.success) {
                appState.currentUser = clientId;
                appState.userType = 'client';
                appState.view = 'client-dashboard';
                appState.currentTab = 'profile';
                showMessage(data.message);
            } else {
                showMessage(data.message, 'error');
            }
        } catch (error) {
            showMessage('Ошибка подключения', 'error');
        }
    }

    function logout() {
        appState.currentUser = null;
        appState.userType = null;
        appState.view = 'login';
        appState.currentTab = 'login';
        appState.selectedClientId = null;
        render();
    }

    async function addMeal(clientId, meal) {
        try {
            const response = await fetch(`${API_URL}/meal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId, ...meal })
            });
            const data = await response.json();
            if (data.success) {
                showMessage('Прием пищи добавлен! Тренер будет уведомлен');
                render();
            }
        } catch (error) {
            showMessage('Ошибка при добавлении', 'error');
        }
    }

    async function addWorkout(clientId, workout) {
        try {
            const response = await fetch(`${API_URL}/workout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId, ...workout })
            });
            const data = await response.json();
            if (data.success) {
                showMessage('Тренировка добавлена! Тренер будет уведомлен');
                render();
            }
        } catch (error) {
            showMessage('Ошибка при добавлении', 'error');
        }
    }

    async function getClients() {
        try {
            const response = await fetch(`${API_URL}/clients`);
            return await response.json();
        } catch (error) {
            return [];
        }
    }

    async function getClientData(clientId) {
        try {
            const response = await fetch(`${API_URL}/client/${clientId}`);
            return await response.json();
        } catch (error) {
            return null;
        }
    }

    function renderLoginScreen() {
        return `
            <div class="login-screen">
                <div class="login-content">
                    <div class="logo">💪</div>
                    <div class="login-title">FitTrack</div>
                    <div class="login-subtitle">Управление клиентами</div>

                    <div class="role-selector">
                        <button class="role-btn ${appState.currentTab === 'trainer-role' ? 'active' : ''}" onclick="appState.currentTab='trainer-role'; render()">
                            👨‍🏫 Тренер
                        </button>
                        <button class="role-btn ${appState.currentTab === 'client-role' ? 'active' : ''}" onclick="appState.currentTab='client-role'; render()">
                            💪 Клиент
                        </button>
                    </div>

                    ${appState.message ? `<div class="message ${appState.message.type}">${appState.message.text}</div>` : ''}

                    ${appState.currentTab === 'trainer-role' ? `
                        <div class="form-group">
                            <label class="form-label">Пин-код</label>
                            <input type="password" id="trainerPin" placeholder="1234" maxlength="4">
                        </div>
                        <button class="btn-primary" onclick="loginTrainer(document.getElementById('trainerPin').value)">Вход</button>
                        <p style="font-size: 11px; color: var(--tg-color-hint); text-align: center; margin-top: 12px;">Пин по умолчанию: 1234</p>
                    ` : `
                        <div id="clientSelectContainer" class="loading">Загрузка клиентов...</div>
                    `}
                </div>
            </div>
        `;
    }

    async function renderClientSelector() {
        const clients = await getClients();
        const html = `
            <div class="form-group">
                <label class="form-label">Выберите профиль</label>
                <select id="clientSelect">
                    <option value="">-- Выберите --</option>
                    ${clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                </select>
            </div>
            <button class="btn-primary" onclick="
                const id = document.getElementById('clientSelect').value;
                id ? loginClient(id) : alert('Выберите профиль');
            ">Вход</button>
        `;
        
        const container = document.getElementById('clientSelectContainer');
        if (container) {
            container.innerHTML = html;
            container.classList.remove('loading');
        }
    }

    async function renderTrainerDashboard() {
        const clients = await getClients();
        const avgProgress = Math.round(clients.reduce((sum, c) => sum + c.progress, 0) / clients.length) || 0;

        return `
            <div class="dashboard">
                <div class="navbar">
                    <div class="navbar-title">👨‍🏫 Админ-панель</div>
                    <button class="back-btn" onclick="logout()">🚪</button>
                </div>

                <div class="content">
                    ${appState.message ? `<div class="message ${appState.message.type}">${appState.message.text}</div>` : ''}

                    <div class="tabs">
                        <button class="tab ${appState.currentTab === 'stats' ? 'active' : ''}" onclick="appState.currentTab='stats'; render()">Статистика</button>
                        <button class="tab ${appState.currentTab === 'clients' ? 'active' : ''}" onclick="appState.currentTab='clients'; render()">Клиенты</button>
                    </div>

                    ${appState.currentTab === 'stats' ? `
                        <div class="stat-card">
                            <div class="stat-label">Всего клиентов</div>
                            <div class="stat-value">${clients.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Средний прогресс</div>
                            <div class="stat-value">${avgProgress}%</div>
                        </div>

                        ${clients.map(client => `
                            <div class="client-item" onclick="appState.selectedClientId=${client.id}; appState.currentTab='client-detail'; render()">
                                <div class="client-name">${client.name}</div>
                                <div class="client-goal">${client.goal}</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${client.progress}%"></div>
                                </div>
                                <div class="client-stats">
                                    <div class="stat-item">
                                        <div class="stat-item-label">Прогресс</div>
                                        <div class="stat-item-value">${client.progress}%</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-item-label">Вес</div>
                                        <div class="stat-item-value">${client.stats.weight}кг</div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    ` : `
                        ${clients.map(client => `
                            <div class="client-item" onclick="appState.selectedClientId=${client.id}; appState.currentTab='client-detail'; render()">
                                <div class="client-name">${client.name}</div>
                                <div class="client-goal">${client.goal}</div>
                                <div class="client-stats">
                                    <div class="stat-item">
                                        <div class="stat-item-label">Питание</div>
                                        <div class="stat-item-value">${client.mealsCount || 0}</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-item-label">Тренировки</div>
                                        <div class="stat-item-value">${client.workoutsCount || 0}</div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    `}

                    ${appState.currentTab === 'client-detail' && appState.selectedClientId ? `<div id="clientDetailContainer" class="loading">Загрузка...</div>` : ''}
                </div>
            </div>
        `;
    }

    async function renderClientDetail() {
        const client = await getClientData(appState.selectedClientId);
        if (!client) return '';

        return `
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
                <button class="back-btn" onclick="appState.currentTab='clients'; appState.selectedClientId=null; render()">← Назад</button>
                <div style="font-size: 18px; font-weight: 600; margin: 12px 0;">${client.name}</div>

                <div class="stat-card">
                    <div class="stat-label">Текущий вес</div>
                    <div class="stat-value">${client.stats.weight}кг</div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">Приемы пищи (${client.meals.length})</div>
                    ${client.meals.length > 0 ? `
                        <table>
                            <tbody>
                                ${client.meals.slice(-5).reverse().map(meal => `
                                    <tr>
                                        <td>${meal.name}</td>
                                        <td style="text-align: right; color: var(--tg-color-hint);">${meal.calories}ккал</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : '<div class="empty-state">Нет данных</div>'}
                </div>

                <div class="form-section">
                    <div class="form-section-title">Тренировки (${client.workouts.length})</div>
                    ${client.workouts.length > 0 ? `
                        <table>
                            <tbody>
                                ${client.workouts.slice(-5).reverse().map(w => `
                                    <tr>
                                        <td>${w.type}</td>
                                        <td style="text-align: right; color: var(--tg-color-hint);">${w.duration}мин</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : '<div class="empty-state">Нет данных</div>'}
                </div>
            </div>
        `;
    }

    async function renderClientDashboard() {
        const client = await getClientData(appState.currentUser);
        if (!client) return '';

        const mealsToday = client.meals.filter(m => m.date === new Date().toISOString().split('T')[0]);
        const workoutsToday = client.workouts.filter(w => w.date === new Date().toISOString().split('T')[0]);

        const totalCalories = mealsToday.reduce((sum, m) => sum + m.calories, 0);
        const totalProteins = mealsToday.reduce((sum, m) => sum + m.proteins, 0);

        return `
            <div class="dashboard">
                <div class="navbar">
                    <div class="navbar-title">💪 ${client.name}</div>
                    <button class="back-btn" onclick="logout()">🚪</button>
                </div>

                <div class="content">
                    ${appState.message ? `<div class="message ${appState.message.type}">${appState.message.text}</div>` : ''}

                    <div class="tabs">
                        <button class="tab ${appState.currentTab === 'profile' ? 'active' : ''}" onclick="appState.currentTab='profile'; render()">Профиль</button>
                        <button class="tab ${appState.currentTab === 'food' ? 'active' : ''}" onclick="appState.currentTab='food'; render()">Питание</button>
                        <button class="tab ${appState.currentTab === 'workouts' ? 'active' : ''}" onclick="appState.currentTab='workouts'; render()">Тренировки</button>
                    </div>

                    ${appState.currentTab === 'profile' ? `
                        <div class="stat-card">
                            <div class="stat-label">Текущий вес</div>
                            <div class="stat-value">${client.stats.weight}кг</div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">Ваша цель</div>
                            <div style="padding: 12px; background: #f5f5f5; border-radius: 8px;">
                                <div style="font-weight: 600; margin-bottom: 8px;">${client.goal}</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${client.progress}%"></div>
                                </div>
                                <div style="font-size: 12px; color: var(--tg-color-hint);">Прогресс: ${client.progress}%</div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">Сегодня</div>
                            <div class="stat-item">
                                <div class="stat-item-label">Калории</div>
                                <div class="stat-item-value">${totalCalories} ккал</div>
                            </div>
                            <div class="stat-item" style="margin-top: 8px;">
                                <div class="stat-item-label">Белки</div>
                                <div class="stat-item-value">${totalProteins}г</div>
                            </div>
                            <div class="stat-item" style="margin-top: 8px;">
                                <div class="stat-item-label">Тренировок</div>
                                <div class="stat-item-value">${workoutsToday.length}</div>
                            </div>
                        </div>
                    ` : appState.currentTab === 'food' ? `
                        <div class="form-section">
                            <div class="form-section-title">Добавить прием пищи</div>
                            <div class="form-group">
                                <label class="form-label">Что кушали?</label>
                                <input type="text" id="mealName" placeholder="Куриное филе с рисом">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Калории</label>
                                    <input type="number" id="mealCal" placeholder="500">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Белки</label>
                                    <input type="number" id="mealProt" placeholder="30">
                                </div>
                            </div>
                            <button class="btn-primary" onclick="
                                addMeal(${client.id}, {
                                    name: document.getElementById('mealName').value || 'Блюдо',
                                    calories: parseInt(document.getElementById('mealCal').value) || 0,
                                    proteins: parseInt(document.getElementById('mealProt').value) || 0,
                                    fats: 0,
                                    carbs: 0
                                });
                            ">Добавить 🍽️</button>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">История (${client.meals.length})</div>
                            ${client.meals.length > 0 ? `
                                <table>
                                    <tbody>
                                        ${client.meals.slice().reverse().map(m => `
                                            <tr>
                                                <td>${m.name}</td>
                                                <td style="text-align: right; color: var(--tg-color-hint);">${m.calories}ккал</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            ` : '<div class="empty-state">Нет записей</div>'}
                        </div>
                    ` : `
                        <div class="form-section">
                            <div class="form-section-title">Добавить тренировку</div>
                            <div class="form-group">
                                <label class="form-label">Тип тренировки</label>
                                <select id="workoutType">
                                    <option value="Кардио">🏃 Кардио</option>
                                    <option value="Силовая">💪 Силовая</option>
                                    <option value="Круговая">🔄 Круговая</option>
                                    <option value="Растяжка">🧘 Растяжка</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Длительность (мин)</label>
                                    <input type="number" id="workoutDur" placeholder="60">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Интенсивность</label>
                                    <select id="workoutInt">
                                        <option value="Низкая">Низкая</option>
                                        <option value="Средняя" selected>Средняя</option>
                                        <option value="Высокая">Высокая</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn-primary" onclick="
                                addWorkout(${client.id}, {
                                    type: document.getElementById('workoutType').value,
                                    duration: parseInt(document.getElementById('workoutDur').value) || 0,
                                    intensity: document.getElementById('workoutInt').value
                                });
                            ">Добавить 🏋️</button>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">История (${client.workouts.length})</div>
                            ${client.workouts.length > 0 ? `
                                <table>
                                    <tbody>
                                        ${client.workouts.slice().reverse().map(w => `
                                            <tr>
                                                <td>${w.type}</td>
                                                <td style="text-align: right; color: var(--tg-color-hint);">${w.duration}мин</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            ` : '<div class="empty-state">Нет записей</div>'}
                        </div>
                    `}
                </div>
            </div>
        `;
    }

    async function render() {
        const app = document.getElementById('app');
        
        if (appState.view === 'login') {
            app.innerHTML = renderLoginScreen();
            if (appState.currentTab === 'client-role') {
                await renderClientSelector();
            }
        } else if (appState.view === 'trainer-dashboard') {
            app.innerHTML = await renderTrainerDashboard();
            if (appState.currentTab === 'client-detail') {
                const detailHtml = await renderClientDetail();
                const container = document.getElementById('clientDetailContainer');
                if (container) {
                    container.innerHTML = detailHtml;
                    container.classList.remove('loading');
                }
            }
        } else if (appState.view === 'client-dashboard') {
            app.innerHTML = await renderClientDashboard();
        }
    }

    render();
</script>
</body>
</html>
